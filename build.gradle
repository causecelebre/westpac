import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  id 'java'
  id 'idea'
  id 'checkstyle'
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.errorprone)
  alias(libs.plugins.spotbugs)
  alias(libs.plugins.spotless)
  alias(libs.plugins.palantir.java.format.idea)
}

group = 'nz.co.bitmonkey'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation platform(SpringBootPlugin.BOM_COORDINATES)
  implementation libs.spring.boot.starter.actuator
  implementation libs.spring.boot.starter.flyway
  implementation libs.spring.boot.starter.jdbc
  implementation libs.spring.boot.starter.security
  implementation libs.spring.boot.starter.validation
  implementation libs.spring.boot.starter.webmvc
  implementation libs.flyway.database.postgresql
  implementation libs.java.uuid.generator
  implementation libs.postgresql
  testImplementation libs.spring.boot.starter.flyway.test
  testImplementation libs.spring.boot.starter.jdbc.test
  testImplementation libs.spring.boot.starter.security.test
  testImplementation libs.spring.boot.starter.test
  testImplementation libs.spring.boot.testcontainers
  testImplementation libs.testcontainers.junit.jupiter
  testImplementation libs.testcontainers.postgresql
  testRuntimeOnly libs.junit.platform.launcher
  compileOnly libs.jspecify
  compileOnly libs.spotbugs.annotations
  errorprone libs.errorprone.core
  errorprone libs.nullaway
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << '-Xlint:all' << '-Xdoclint:all,-missing'
  options.errorprone {
    disableWarningsInGeneratedCode = true
    error('NullAway')
    option('NullAway:AnnotatedPackages', 'nz.co.bitmonkey')
    option('NullAway:JSpecifyMode', 'true')
  }
}

tasks.named('test') {
  useJUnitPlatform()
  mustRunAfter 'spotlessCheck', 'checkstyleMain'
  jvmArgs '-XX:+ExitOnOutOfMemoryError'
}

tasks.named('bootRun') {
  jvmArgs '-XX:+ExitOnOutOfMemoryError'
}

spotbugs {
  toolVersion = libs.versions.spotbugs.asProvider().get()
  effort = Effort.MAX
  reportLevel = Confidence.valueOf('DEFAULT')
  excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.spotbugsTest { enabled = false }
tasks.withType(SpotBugsTask).configureEach {
  reports {
    html.required = true
    xml.required = false
  }
}

checkstyle {
  toolVersion = libs.versions.checkstyle.get()
  configFile = file('config/checkstyle/checkstyle.xml')
  configDirectory = file('config/checkstyle')
  maxWarnings = 0
  ignoreFailures = false
}

spotless {
  java {
    target 'src/**/*.java'
    palantirJavaFormat(libs.versions.palantir.java.format.get()).formatJavadoc(true)
    removeUnusedImports()
    formatAnnotations()
    trimTrailingWhitespace()
    endWithNewline()
    toggleOffOn()
    licenseHeaderFile('config/licence-header.txt')
  }
  format 'misc', {
    target '*.gradle', '.gitignore', 'src/**/*.yml', 'src/**/*.sql'
    trimTrailingWhitespace()
    endWithNewline()
  }
  format 'markdown', {
    target '*.md'
    endWithNewline()
  }
}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/westpac
    username: westpac_app
    password: ${DB_APP_PASSWORD}
  flyway:
    user: westpac_owner
    password: ${DB_OWNER_PASSWORD}
    default-schema: westpac
    validate-on-migrate: true
    clean-disabled: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info

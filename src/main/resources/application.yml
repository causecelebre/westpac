spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/westpac
    username: westpac_app
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        options: "-c statement_timeout=3s -c lock_timeout=2s"
        connectTimeout: 2
        socketTimeout: 5
        cancelSignalTimeout: 1
  threads:
    virtual:
      enabled: true
  flyway:
    user: westpac_owner
    password: ${DB_OWNER_PASSWORD}
    default-schema: westpac
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 250ms
      connect-timeout: 250ms
  jackson:
    factory:
      constraints:
        read:
          max-document-length: 4096
    deserialization:
      fail-on-unknown-properties: true
    read:
      strict-duplicate-detection: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

server:
  port: ${APP_PORT}
  shutdown: graceful
  tomcat:
    connection-timeout: 10s

management:
  server:
    port: ${MANAGEMENT_PORT}
  endpoint:
    health:
      show-components: always
      group:
        readiness:
          include: readinessState, db
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

westpac:
  account-number:
    bank: "03"
  moderation:
    list-location: classpath:moderation/offensive-nicknames.txt
  cache:
    time-to-live: 10m

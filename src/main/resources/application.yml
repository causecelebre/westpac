spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/westpac
    username: westpac_app
    password: ${DB_APP_PASSWORD}
  flyway:
    user: westpac_owner
    password: ${DB_OWNER_PASSWORD}
    default-schema: westpac
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 250ms
      connect-timeout: 250ms
  jackson:
    factory:
      constraints:
        read:
          max-document-length: 4096
    deserialization:
      fail-on-unknown-properties: true
    read:
      strict-duplicate-detection: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info

westpac:
  account-number:
    bank: "03"
  moderation:
    list-location: classpath:moderation/offensive-nicknames.txt
  cache:
    time-to-live: 10m
